<title>Claude usage</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#fff; --ink:#1d1c1a; --muted:#6f6c66; --line:#e6e3dd;
    --track:#ecebe7; --ok:#3d7a5a; --warn:#c08a1e; --hot:#c0432f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#151413; --card:#1f1e1c; --ink:#f1efea; --muted:#9a968e; --line:#2e2c29;
      --track:#2c2a27; --ok:#5fae84; --warn:#e0a83a; --hot:#e3664f; }
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
    padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    min-height:100vh;-webkit-text-size-adjust:100%}
  main{max-width:520px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  h1{font-size:20px;font-weight:650;letter-spacing:-.01em}
  .status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .dot.stale{background:var(--warn)} .dot.err{background:var(--hot)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}

  /* Headline */
  .head{border-color:color-mix(in srgb,var(--c) 35%,var(--line));background:color-mix(in srgb,var(--c) 9%,var(--card))}
  .head-t{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:-.015em;color:var(--c)}
  .head-t .pdot{width:11px;height:11px}
  .head-s{margin-top:6px;color:var(--ink);font-size:14px}
  .head-s b{font-variant-numeric:tabular-nums}

  .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .label{font-weight:600}
  .pct{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .card.primary .pct{font-size:40px}
  .viewbar{display:flex;justify-content:flex-end;margin:-6px 0 10px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:2px;background:var(--card)}
  .seg button{border:0;background:none;font:inherit;font-size:12px;font-weight:600;padding:3px 12px;border-radius:99px;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--ink);color:var(--bg)}
  .pct small{font-size:15px;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
  .bar{position:relative;height:8px;background:var(--track);border-radius:99px}
  .fill{height:100%;border-radius:99px;background:var(--ok);transition:width .6s ease}
  .fill.warn{background:var(--warn)} .fill.hot{background:var(--hot)}
  .ideal{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);opacity:.55;border-radius:1px}
  .reset{margin-top:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

  .pace{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--c);
    background:color-mix(in srgb,var(--c) 14%,transparent);padding:3px 9px;border-radius:99px}
  .pdot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
  .pace-gauge{position:relative;height:6px;margin:10px 0 10px;border-radius:99px;
    background:linear-gradient(90deg,hsl(140 60% 45%) 0%,hsl(140 60% 45%) 20%,hsl(40 85% 50%) 60%,hsl(5 70% 50%) 90%)}
  .pace-needle{position:absolute;top:-4px;width:4px;height:14px;margin-left:-2px;border-radius:2px;
    background:var(--ink);box-shadow:0 0 0 2px var(--card)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0;font-variant-numeric:tabular-nums}
  .kv dd .sub{color:var(--muted)}
  .kv dd.bad{color:var(--hot);font-weight:600}
  .kv dd.good{color:var(--ok)}
  .kv dd.warn{color:var(--warn);font-weight:600}

  .plan-cap{font-size:12px;color:var(--muted);margin:12px 0 6px}
  .plan{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-bottom:12px}
  .plan > div{background:var(--track);border-radius:10px;padding:7px 4px;text-align:center;min-width:0}
  .plan .d{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plan .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  .plan .today{background:color-mix(in srgb,var(--ok) 15%,var(--card));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ok) 55%,transparent)}
  .plan .today .d{color:var(--ok);font-weight:650}
  .plan .c{font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap}
  .legend{font-size:12px;color:var(--muted);margin-top:4px;text-align:center}
  .msg{color:var(--muted);text-align:center;padding:28px 8px}
  .msg b{color:var(--ink)}
  input{width:100%;padding:10px;margin-top:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
  footer{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Claude usage</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="ago">—</span></div>
  </header>
  <div class="viewbar"><div class="seg" role="group" aria-label="Show">
    <button type="button" data-view="left">Left</button><button type="button" data-view="used">Used</button></div></div>
  <div id="app"><div class="msg">Loading…</div></div>
  <p class="legend">Counts 08:00–24:00 as your possible working time · tick on a bar = even pace now</p>
  <footer id="foot"></footer>
</main>
<script>
const LABELS = {
  five_hour: "Session · 5 hours",
  seven_day: "Week · all models",
  seven_day_opus: "Week · Opus",
  seven_day_sonnet: "Week · Sonnet",
  seven_day_cowork: "Week · Cowork",
  seven_day_oauth_apps: "Week · Connected apps",
};
const SHORT = { five_hour: "Session", seven_day: "Week" };
const POLL_MS = 180_000, STALE_MS = 10 * 60_000;   // GitHub allows 60 anonymous reads/hour per network
const RECENT_MS = 60 * 60_000, RECENT_MIN_MS = 15 * 60_000;   // recent rate: last hour, needs ≥15 min of data
const app = document.getElementById("app");
let gistId = location.hash.slice(1);
if (!/^[0-9a-f]{20,40}$/i.test(gistId)) gistId = "";
try { if (gistId) localStorage.setItem("gist", gistId); else gistId = localStorage.getItem("gist") || ""; } catch {}

let etag = null, data = null, backoff = 0, timer = null, lastPoll = 0, problem = null;
let view = "left";                                  // "left" (default) or "used"; remembered per device
try { if (localStorage.getItem("view") === "used") view = "used"; } catch {}
function setView(v){
  view = v; try { localStorage.setItem("view", v); } catch {}
  document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.view === view));
  if (data) render();
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
setView(view);

// ---- Working-time helpers (local time) ----
const WORK_START = 8, WORK_END = 24;            // 08:00–24:00; night is ignored
const H = 3600_000, DAY_WORK = (WORK_END - WORK_START) * H;
function windowLen(k){ return k === "five_hour" ? 5 * H : 7 * 24 * H; }
function isSession(k){ return k === "five_hour"; }

// Working milliseconds between a and b
function workMs(a, b){
  if (b <= a) return 0;
  let total = 0;
  const d = new Date(a); d.setHours(0, 0, 0, 0);
  while (d.getTime() < b) {
    const s = new Date(d); s.setHours(WORK_START, 0, 0, 0);
    const e = new Date(d); e.setHours(WORK_END, 0, 0, 0);   // 24 → next midnight
    total += Math.max(0, Math.min(b, e.getTime()) - Math.max(a, s.getTime()));
    d.setDate(d.getDate() + 1);
  }
  return total;
}
// Timestamp reached after spending `ms` of working time starting at t
function addWorkMs(t, ms){
  let cur = t, left = ms;
  for (let i = 0; i < 400 && left > 0; i++) {
    const d = new Date(cur);
    const s = new Date(d); s.setHours(WORK_START, 0, 0, 0);
    const e = new Date(d); e.setHours(WORK_END, 0, 0, 0);
    if (cur < s.getTime()) cur = s.getTime();
    if (cur >= e.getTime()) { cur = e.getTime(); continue; }
    const avail = e.getTime() - cur;
    if (left <= avail) return cur + left;
    left -= avail; cur = e.getTime();
  }
  return left > 0 ? Infinity : cur;
}

// ---- Pace over the whole window (average since window start) ----
function pace(k, used, resetsAt){
  const now = Date.now(), end = Date.parse(resetsAt), start = end - windowLen(k);
  const done = workMs(start, now), left = workMs(now, end), total = done + left;
  const res = { expected: total ? done / total * 100 : 0, workLeft: left, end };
  if (left <= 0)          return { ...res, projected: used, state: 0, offHours: true };
  if (done < 15 * 60_000) return { ...res, projected: null, state: used >= 50 ? 3 : 0, fresh: true };
  const projected = used + used / done * left;
  const state = used >= 95 || projected > 130 ? 3 : projected > 100 ? 2 : projected > 80 ? 1 : 0;
  return { ...res, projected, state };
}
const PACE = ["Comfortable", "On track", "Tight", "Over pace"];
function stateFor(used, proj, fallback){
  if (proj == null) return fallback;
  return used >= 95 || proj > 130 ? 3 : proj > 100 ? 2 : proj > 80 ? 1 : 0;
}
function paceColor(proj){
  const p = proj == null ? 60 : proj;
  const hue = p <= 60 ? 140 : p <= 100 ? 140 - (p - 60) / 40 * 100 : Math.max(5, 40 - (p - 100) / 30 * 35);
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  return `hsl(${hue.toFixed(0)} 65% ${dark ? 55 : 42}%)`;
}
function hueColor(h){ const dark = matchMedia("(prefers-color-scheme: dark)").matches; return `hsl(${h} 62% ${dark ? 56 : 40}%)`; }

// ---- Recent burn rate from the Mac's short history ----
// returns {rate (%/ms), span} | {missing:true} | null (not enough data yet)
function recentRate(k){
  if (!Array.isArray(data.history) || !Array.isArray(data.history_keys)) return { missing: true };
  const idx = data.history_keys.indexOf(k) + 1;
  if (idx < 1) return { missing: true };
  const h = data.history.filter(r => Array.isArray(r) && typeof r[0] === "number" && typeof r[idx] === "number");
  if (h.length < 2) return null;
  const last = h[h.length - 1], cutoff = last[0] * 1000 - RECENT_MS;
  let first = last;
  for (let i = h.length - 2; i >= 0; i--) {
    const r = h[i];
    if (r[0] * 1000 < cutoff) break;
    if (r[idx] > first[idx]) break;          // window reset happened here
    first = r;
  }
  const span = (last[0] - first[0]) * 1000;
  if (span < RECENT_MIN_MS) return null;
  return { rate: Math.max(0, last[idx] - first[idx]) / span, span };
}
// When would the window hit 100% at the recent rate?
function eta(k, used, end, rr){
  if (!rr || rr.missing) return rr;
  if (rr.rate <= 0) return { idle: true, ...rr };
  const need = (100 - used) / rr.rate, now = Date.now();
  const t = isSession(k) ? now + need : addWorkMs(now, need);
  return { t, before: t < end, ...rr };
}

// ---- Day plan: future days keep the normal allowance, today gets the rest ----
// Normal allowance = 100% spread evenly over the week's working time (08–24, ≈112 h → ~14.3% per full day).
// Surplus (you're under pace) goes to today. Deficit: today gets 0 and the next days shrink evenly.
function dayPlan(left, end){
  const now = Date.now(), W = workMs(end - 7 * 24 * H, end);
  if (W <= 0 || workMs(now, end) <= 0) return null;
  const days = [], d = new Date(now); d.setHours(0, 0, 0, 0);
  for (let i = 0; i < 10 && d.getTime() < end; i++) {
    const next = new Date(d); next.setDate(next.getDate() + 1);
    const ms = workMs(Math.max(now, d.getTime()), Math.min(end, next.getTime()));
    if (ms > 0 || i === 0) days.push({ day: new Date(d), i, def: 100 * ms / W, until: end < next.getTime() ? end : null });
    d.setDate(d.getDate() + 1);
  }
  const today = days[0], future = days.slice(1);
  const futureDef = future.reduce((a, p) => a + p.def, 0);
  let mode;
  if (left >= futureDef) { mode = "surplus"; future.forEach(p => p.share = p.def); today.share = left - futureDef; }
  else { mode = "deficit"; today.share = 0; future.forEach(p => p.share = p.def * left / futureDef); }
  return { days, mode, today: today.share, perDay: 100 * DAY_WORK / W };
}
// Session-% you could still use before midnight if you worked nonstop (current session + new ones every 5 h)
function sessionRoomToday(){
  const u = data.usage && data.usage.five_hour;
  if (!u || typeof u.utilization !== "number") return null;
  const now = Date.now(), mid = new Date(now); mid.setHours(24, 0, 0, 0);
  let room = 0, next = now;
  const r = Date.parse(u.resets_at);
  if (!isNaN(r) && r > now) { room += Math.max(0, 100 - u.utilization); next = r; }
  if (next < mid.getTime()) room += 100 * Math.ceil((mid.getTime() - next) / (5 * H));
  return room;
}
function dayName(p){
  if (p.i === 0) return "Today";
  if (p.i === 1) return "Tomorrow";
  return p.day.toLocaleDateString([], {weekday: "short"});
}
// ---- What one full 5-hour session costs in weekly %, learned from the Mac's history ----
function sessionCost(){
  if (!Array.isArray(data.history) || !Array.isArray(data.history_keys)) return null;
  const si = data.history_keys.indexOf("five_hour") + 1, wi = data.history_keys.indexOf("seven_day") + 1;
  if (si < 1 || wi < 1) return null;
  const h = data.history.filter(r => Array.isArray(r) && typeof r[si] === "number" && typeof r[wi] === "number");
  let dS = 0, dW = 0, start = 0;
  for (let i = 1; i <= h.length; i++) {          // add up stretches between resets
    const cut = i === h.length || h[i][si] < h[i-1][si] || h[i][wi] < h[i-1][wi];
    if (cut) { dS += h[i-1][si] - h[start][si]; dW += h[i-1][wi] - h[start][wi]; start = i; }
  }
  if (dS < 20 || dW < 2) return null;            // not enough usage seen yet to be reliable
  return dW / dS * 100;                          // weekly % per full session
}
function sessions(pct, cost){ const n = pct / cost; return n < 1 ? "less than 1 full session" : `≈ ${num(n)} full session${n >= 1.5 ? "s" : ""}`; }

// ---- Formatting ----
function esc(v){ return String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function level(p){ return p >= 90 ? "hot" : p >= 70 ? "warn" : ""; }
function fmtDur(ms){
  if (ms <= 0) return "now";
  const m = Math.round(ms/60000), d = Math.floor(m/1440), h = Math.floor((m%1440)/60), mm = m%60;
  return d ? `${d}d ${h}h` : h ? `${h}h ${mm}m` : `${mm}m`;
}
function fmtAgo(ms){ const s = Math.max(0, Math.round(ms/1000)); return s < 60 ? `${s}s ago` : s < 5400 ? `${Math.round(s/60)}m ago` : `${fmtDur(ms)} ago`; }
function fmtWhen(t){
  const d = new Date(t), now = new Date();
  const time = d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  if (d.toDateString() === now.toDateString()) return time;
  const tm = new Date(now); tm.setDate(tm.getDate() + 1);
  if (d.toDateString() === tm.toDateString()) return `tomorrow ${time}`;
  return `${d.toLocaleDateString([], {weekday:"short"})} ${time}`;
}
function fmtApprox(t){ return fmtWhen(Math.round(t / 300_000) * 300_000); }   // nearest 5 min
function num(x){ return x >= 10 ? Math.round(x).toString() : x.toFixed(1).replace(/\.0$/, ""); }

// ---- Data loading ----
function askForId(){
  app.innerHTML = `<div class="card msg">Paste your gist ID (printed by <b>setup.sh</b>)
    <input id="gid" placeholder="e.g. 3f2a…" autocomplete="off"></div>`;
  document.getElementById("gid").addEventListener("change", e => {
    const v = e.target.value.trim(); if (!/^[0-9a-f]{20,40}$/i.test(v)) return;
    gistId = v; location.hash = v; try { localStorage.setItem("gist", v); } catch {} poll();
  });
}

async function poll(){
  clearTimeout(timer);
  if (!gistId) return askForId();
  if (document.hidden) return;                 // no requests while the tab/app is in the background
  lastPoll = Date.now();
  let r;
  try {
    r = await fetch(`https://api.github.com/gists/${gistId}`, {
      headers: Object.assign({Accept:"application/vnd.github+json"}, etag ? {"If-None-Match": etag} : {}),
      cache: "no-store",
    });
  } catch {
    problem = "Can't reach GitHub right now. Retrying…";
    backoff = Math.min((backoff || 30_000) * 2, 5 * 60_000);
    return finish();
  }
  if (r.status === 304) { backoff = 0; problem = null; }
  else if (r.ok) {
    const g = await r.json();
    const f = g.files && g.files["usage.json"];
    try {
      data = JSON.parse(f.content);
      etag = r.headers.get("ETag"); backoff = 0; problem = null;
    } catch (e) {
      etag = null; backoff = 60_000;
      problem = `Your Mac pushed data the page can't read (${esc(e.message)}). Re-copy <b>push.sh</b> and check <b>~/.claude-usage-dash/error.log</b>.`;
    }
  } else if (r.status === 403 || r.status === 429) {
    const reset = Number(r.headers.get("x-ratelimit-reset")) * 1000;
    backoff = reset > Date.now() ? Math.min(reset - Date.now() + 5_000, 60 * 60_000) : 5 * 60_000;
    problem = `GitHub's limit for anonymous reads (60/hour per network) is used up` +
      (reset > Date.now() ? `. It resets at <b>${fmtWhen(reset)}</b>; the page retries then.` : `. Retrying in 5 min.`) +
      ` Close extra tabs of this page to stay under it.`;
  } else if (r.status === 404) {
    app.innerHTML = `<div class="card msg">Gist not found. Check the ID in the link.</div>`; return;
  } else {
    problem = `GitHub returned HTTP ${r.status}. Retrying…`; backoff = 2 * 60_000;
  }
  finish();
}
function finish(){
  render();
  timer = setTimeout(poll, backoff || POLL_MS);
}
// Refresh when you come back to the tab/app (but not more than once a minute)
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !gistId) return;
  if (Date.now() - lastPoll > 60_000) poll(); else { clearTimeout(timer); timer = setTimeout(poll, POLL_MS - (Date.now() - lastPoll)); }
});

// ---- Rendering ----
function render(){
  const dot = document.getElementById("dot"), ago = document.getElementById("ago");
  const note = problem ? `<div class="card msg">${problem}</div>` : "";
  if (!data) {
    app.innerHTML = note || `<div class="card msg">Loading…</div>`; return;
  }
  if (data.status === "pending") {
    app.innerHTML = note + `<div class="card msg">Waiting for the first push from your Mac…</div>`; return;
  }
  const now = Date.now();
  const age = now - Date.parse(data.updated_at);                        // how old the numbers are
  const macAge = now - Date.parse(data.checked_at || data.updated_at);  // when the Mac last pushed
  const retryAt = typeof data.retry_at === "number" ? data.retry_at * 1000 : 0;
  const macQuiet = macAge > STALE_MS && !(retryAt && now < retryAt + 2 * 60_000);   // not just waiting out a back-off
  const warn = typeof data.warning_http === "number" || !!data.warning;
  dot.className = "dot" + (data.status === "error" || data.warning ? " err" : (warn || macQuiet) ? " stale" : "");
  ago.textContent = "Updated " + fmtAgo(age);
  const next = retryAt > now ? ` Next check at <b>${fmtWhen(retryAt)}</b>.` : "";
  const loginMsg = w => (w === "logged_out"
      ? "Claude Code is logged out on your Mac. Run <b>claude</b> in Terminal there and log in."
      : "Claude Code's login on your Mac has expired. Run <b>claude</b> in Terminal there to refresh it.")
    + " The dashboard updates within a minute after.";
  const reason = h => h === 429 ? "Anthropic is limiting how often your usage can be checked (HTTP 429)."
    : h === 0 ? "Your Mac couldn't reach Anthropic (offline?)."
    : `The usage check failed (HTTP ${esc(h)}).`;

  if (data.status === "error") {
    const why = data.warning ? loginMsg(data.warning)
      : data.http === 401 ? loginMsg("expired")
      : reason(data.http) + next;
    app.innerHTML = note + `<div class="card msg">${why}</div>`;
    document.title = "! Claude usage";
    return;
  }

  const u = data.usage || {};
  const keys = Object.keys(LABELS).filter(k => u[k] && typeof u[k] === "object" && typeof u[k].utilization === "number");
  const items = keys.map(k => {
    const used = Math.max(0, Math.min(100, u[k].utilization));
    const it = { k, used };
    if (u[k].resets_at && !isNaN(Date.parse(u[k].resets_at))) {
      it.pc = pace(k, used, u[k].resets_at);
      it.eta = eta(k, used, it.pc.end, recentRate(k));
      // Gauge + pill use the worse of: window-average projection, last-hour projection
      let recentProj = null;
      if (it.eta && it.eta.rate != null && !it.pc.offHours) {
        const rem = isSession(k) ? Math.max(0, it.pc.end - Date.now()) : it.pc.workLeft;
        recentProj = used + it.eta.rate * rem;
      }
      const cands = [it.pc.projected, recentProj].filter(x => x != null);
      it.proj = it.pc.offHours ? used : cands.length ? Math.max(...cands) : null;
      it.state = it.pc.offHours ? 0 : stateFor(used, it.proj, it.pc.state);
      if (it.eta && it.eta.before && !it.pc.offHours) it.state = 3;   // runs out before reset at the current rate
      if (!isSession(k)) it.wk = weekStatus(it);                      // weekly: judge today's budget instead
    }
    return it;
  });

  const cards = items.map((it, i) => card(it, i === 0)).join("");
  app.innerHTML = note + (items.length ? headline(items) : "") +
    (warn ? `<div class="card msg">${data.warning ? loginMsg(data.warning) : reason(data.warning_http) + next} Showing numbers from <b>${fmtWhen(Date.parse(data.updated_at))}</b>.</div>` : "") +
    (macQuiet ? `<div class="card msg">Your Mac hasn't reported for ${fmtDur(macAge)}. Is it awake?</div>` : "") +
    (cards || `<div class="card msg">No usage windows in the response.</div>`);

  const s = items.find(x => x.k === "five_hour"), w = items.find(x => x.k === "seven_day");
  const tv = x => Math.round(view === "left" ? 100 - x.used : x.used);
  document.title = [s && `${tv(s)}%`, w && `${tv(w)}%`].filter(Boolean).join(" · ") + ` ${view} — Claude usage`;
  tick();
}

// ---- Weekly windows: judge today's budget, never a whole-week projection ----
// level 0 = within today's budget, 1 = today's budget runs out before midnight, 2 = runs out within the hour / used up
function weekStatus(it){
  const now = Date.now(), plan = dayPlan(100 - it.used, it.pc.end);
  if (!plan) return null;
  const rate = it.eta && it.eta.rate > 0 ? it.eta.rate : 0;            // %/ms over the last hour
  const mid = new Date(now); mid.setHours(24, 0, 0, 0);
  const limit = Math.min(mid.getTime(), it.pc.end);                    // end of today, or the reset if sooner
  const left = plan.mode === "surplus" ? plan.today : 0;
  let level = 0, runsOut = null;
  if (left <= 0.05) level = 2;
  else if (rate > 0) {
    runsOut = now + left / rate;
    if (runsOut - now < H) level = 2; else if (runsOut < limit) level = 1;
  }
  const nxt = plan.days[1];
  const after = plan.days.length === 1 ? ` Then the week is used up until the reset at ${fmtWhen(it.pc.end)}.`
    : ` After that you'd dip into ${nxt && nxt.i === 1 ? `tomorrow's ${Math.round(nxt.share)}%` : "the next days' share"}.`;
  return { plan, left, rate, runsOut, level, limit, after, lastDay: plan.days.length === 1 };
}
const WK_HUE = [140, 35, 5];
function wkPill(wk){
  if (wk.level === 0) return "Within today's budget";
  if (wk.left <= 0.05) return wk.lastDay ? "Used up until the reset" : "Today's budget used up";
  return wk.level === 2 ? `Today's budget runs out ~${fmtApprox(wk.runsOut)}` : `Today's budget lasts until ~${fmtApprox(wk.runsOut)}`;
}

function headline(items){
  const w = items.find(x => x.k === "seven_day" && x.wk);
  const cost = sessionCost(), room = sessionRoomToday();
  const cap = cost && room != null ? room / 100 * cost : null;         // what the 5-hour limit lets you reach today
  const msgs = [];

  // 1) The 5-hour session: don't hit its limit before it resets
  for (const it of items.filter(x => isSession(x.k) && x.pc && !x.pc.offHours)) {
    const name = SHORT[it.k] || LABELS[it.k];
    if (it.eta && it.eta.before)
      msgs.push({ sev: 2, from: "session", text: `<b>${esc(name)}</b> runs out at <b>${fmtWhen(it.eta.t)}</b> at your last-hour rate, ${fmtDur(it.pc.end - it.eta.t)} before it resets at ${fmtWhen(it.pc.end)}.` });
    else if (it.state >= 2)
      msgs.push({ sev: it.state === 3 ? 2 : 1, from: "session", text: `<b>${esc(name)}</b> is heading to <b>~${Math.round(it.proj)}%</b> before it resets at ${fmtWhen(it.pc.end)}.` });
  }
  // 2) Weekly windows: don't spend more than today's share
  for (const it of items.filter(x => x.wk && x.wk.level > 0)) {
    const wk = it.wk, what = it.k === "seven_day" ? "today's" : `today's ${esc(LABELS[it.k].replace("Week · ", ""))}`;
    let text;
    if (wk.left <= 0.05) {
      if (wk.lastDay) text = `The week is used up until the reset at <b>${fmtWhen(it.pc.end)}</b>.`;
      else {
        const nxt = wk.plan.days.find(p => p.i > 0 && !p.until) || wk.plan.days[1];
        text = `${what[0].toUpperCase() + what.slice(1)} budget is used up: anything more comes out of the next days` +
          (nxt ? ` (now <b>~${num(nxt.share)}%</b> per full day instead of ${num(wk.plan.perDay)}%).` : ".");
      }
    } else {
      text = `At your last-hour rate (<b>+${num(wk.rate * H)}%/h</b>), ${what} <b>${num(wk.left)}%</b> ` +
        (wk.level === 2 ? `runs out at <b>${fmtWhen(wk.runsOut)}</b>.` : `lasts until <b>~${fmtApprox(wk.runsOut)}</b>.`) + wk.after;
    }
    msgs.push({ sev: wk.level, from: "week", text });
  }

  let todayTxt = "";
  if (w && w.wk.left > 0.05) {
    todayTxt = `Today you can use up to <b>${num(w.wk.left)}%</b> of your week` + (cost ? ` (${sessions(w.wk.left, cost)})` : "") + ".";
    if (cap != null && cap < w.wk.left - 0.5) todayTxt += ` The 5-hour limit caps you at about <b>${num(cap)}%</b> before midnight.`;
  }
  const rollTxt = w && w.wk.lastDay ? `Whatever is left resets at <b>${fmtWhen(w.pc.end)}</b>.` : "Whatever you don't use rolls over to tomorrow.";

  msgs.sort((a, b) => b.sev - a.sev);
  const top = msgs[0];
  let title, hue, sub;
  if (top && top.sev === 2) { title = "Slow down"; hue = 5; }
  else if (top && top.sev === 1) { title = top.from === "session" ? "Pace the session" : "Watch today's budget"; hue = 35; }
  if (top) sub = top.text + (top.from === "session" && todayTxt ? " " + todayTxt : "");
  else { title = "Spend freely"; hue = 140; sub = todayTxt ? `${todayTxt} ${rollTxt}` : "Within your limits on every window."; }
  return `<div class="card head" style="--c:${hueColor(hue)}">
    <div class="head-t"><span class="pdot"></span>${title}</div>
    <div class="head-s">${sub}</div></div>`;
}

function lastHourRow(e, render){
  if (e && e.missing) return ["Last hour", `<span class="sub">update push.sh on your Mac to enable</span>`];
  if (!e) return ["Last hour", `<span class="sub">measuring… (needs 15 min of data)</span>`];
  if (e.idle) return ["Last hour", `<span class="sub">no usage</span>`];
  const span = Math.round(e.span / 60_000);
  const [txt, cls] = render(`<b>+${num(e.rate * H)}%/h</b>`);
  return [span >= 55 ? "Last hour" : `Last ${span}m`, txt, cls];
}

function card(it, primary){
  const { k, used, pc, eta: e, proj, state, wk } = it;
  const L = view === "left";
  const reset = u_reset(k);
  let marker = "", paceHtml = "";
  if (pc) {
    marker = `<div class="ideal" style="left:${(L ? 100 - pc.expected : pc.expected).toFixed(1)}%" title="Even pace now"></div>`;
    const rows = [], left = 100 - used, cost = sessionCost();
    let pill, gauge = "", planHtml = "";

    if (isSession(k)) {
      // ---- 5-hour session: will it run out before it resets? ----
      pill = `<span class="pill" style="--c:${paceColor(proj)}"><span class="pdot"></span>${pc.offHours ? "Resets overnight" : proj == null ? "Just started" : PACE[state]}</span>`;
      gauge = `<div class="pace-gauge" title="Projected % at reset (worse of average and last hour): 40% left → 140% right"><div class="pace-needle" style="left:${Math.min(100, Math.max(0, ((proj ?? 40) - 40)))}%"></div></div>`;
      if (pc.offHours) rows.push(["Note", `Resets before 08:00. Use what's left freely.`]);
      if (k === "five_hour" && cost) rows.push(["Cost", `1 full session ≈ <b>${num(cost)}%</b> of your week`]);
      if (pc.fresh) rows.push(["Avg pace", `<span class="sub">window just started</span>`]);
      else if (!pc.offHours) rows.push(["Avg pace", pc.projected >= 100 ? `<b>runs out</b> before reset`
        : L ? `<b>~${Math.round(100 - pc.projected)}%</b> left at reset` : `<b>~${Math.round(pc.projected)}%</b> used at reset`]);
      rows.push(lastHourRow(e, r => e.before ? [`${r} → runs out <b>${fmtWhen(e.t)}</b>`, "bad"] : [`${r} → won't run out before reset`, "good"]));
    } else if (wk) {
      // ---- Weekly window: today's budget; next days keep the normal share ----
      pill = `<span class="pill" style="--c:${hueColor(WK_HUE[wk.level])}"><span class="pdot"></span>${wkPill(wk)}</span>`;
      const plan = wk.plan;
      const room = sessionRoomToday(), cap = cost && room != null ? room / 100 * cost : null;
      const capped = k === "seven_day" && cap != null && wk.left > 0.05 && cap < wk.left - 0.5;
      if (k === "seven_day") {
        const cap1 = plan.days.length === 1 ? `Remaining <b>${num(left)}%</b> is all yours until the reset`
          : plan.mode === "surplus" ? `Remaining <b>${num(left)}%</b>: the next days keep the normal <b>${num(plan.perDay)}%</b> per full day, today gets the rest`
          : `Remaining <b>${num(left)}%</b> is less than the normal share for the days left, so the next days are reduced`;
        const t = ms => new Date(ms).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
        planHtml = `<div class="plan-cap">${cap1}</div>
          <div class="plan">${plan.days.map(p => `<div class="${p.i === 0 ? "today" : ""}"><div class="d">${dayName(p)}${p.until ? ` →${t(p.until)}` : ""}</div><div class="v">${Math.round(p.share)}%</div>${p.i === 0 && capped ? `<div class="c">max ~${Math.round(cap)}%</div>` : ""}</div>`).join("")}</div>`;
      }
      rows.push(["Today", `<b>${num(wk.left)}%</b>` +
        (k === "seven_day" && cost && wk.left > 0.05 ? ` <span class="sub">· ${sessions(wk.left, cost)}</span>` : "") +
        (capped ? ` <span class="sub">· 5-hour limit: ~${num(cap)}% before 24:00</span>` : "")]);
      rows.push(lastHourRow(e, r => {
        if (wk.left <= 0.05) return [`${r} → today's budget is used up`, "bad"];
        if (wk.level === 2) return [`${r} → today's ${num(wk.left)}% runs out <b>${fmtWhen(wk.runsOut)}</b>`, "bad"];
        if (wk.level === 1) return [`${r} → today's ${num(wk.left)}% lasts until <b>~${fmtApprox(wk.runsOut)}</b>`, "warn"];
        return [`${r} → today's ${num(wk.left)}% lasts ${wk.lastDay ? "until the reset" : "past midnight"}`, "good"];
      }));
    } else {
      pill = `<span class="pill" style="--c:${hueColor(140)}"><span class="pdot"></span>—</span>`;
    }

    paceHtml = `<div class="pace">${pill}${gauge || `<div style="height:4px"></div>`}
      ${planHtml}<dl class="kv">${rows.map(([a, b, cls]) => `<dt>${a}</dt><dd${cls ? ` class="${cls}"` : ""}>${b}</dd>`).join("")}</dl></div>`;
  }
  return `<div class="card${primary ? " primary" : ""}">
    <div class="row"><span class="label">${esc(LABELS[k])}</span><span class="pct">${Math.round(L ? 100 - used : used)}%<small>${L ? "left" : "used"}</small></span></div>
    <div class="bar"><div class="fill ${level(used)}" style="width:${L ? 100 - used : used}%"></div>${marker}</div>
    <div class="reset">${Math.round(L ? used : 100 - used)}% ${L ? "used" : "left"}${reset ? " · " + reset : ""}</div>${paceHtml}</div>`;
}
function u_reset(k){
  const r = data.usage[k].resets_at;
  return r ? `resets in <span data-reset="${esc(r)}"></span>` : "";
}

function tick(){
  document.querySelectorAll("[data-reset]").forEach(el => {
    const t = Date.parse(el.dataset.reset);
    if (!isNaN(t)) el.textContent = `${fmtDur(t - Date.now())} · ${fmtWhen(t)}`;
  });
  if (data && data.updated_at) document.getElementById("ago").textContent = "Updated " + fmtAgo(Date.now() - Date.parse(data.updated_at));
}
setInterval(tick, 15_000);
const VERSION = "v12 · 22 Oct 22:15";
document.getElementById("foot").textContent = `${VERSION} · Mac checks every 3 min · page refreshes every 3 min`;
poll();
</script>
</body>
</html>
